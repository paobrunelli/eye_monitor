<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Test Battito Occhi</title>
<meta name="theme-color" content="#9a9a9e" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" href="../icon-192.png" />
<link rel="apple-touch-icon" href="../icon-192.png" />
<style>
  :root {
    --bg: #9a9a9e;
    --black: #101012;
    --red: #d5372f;
    --green: #2f9e5a;
    --gray: #5a5a5e;
    --ink: #1a1a1c;
    --dim: #4a4a4e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    touch-action: manipulation;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .controls {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 14px;
    padding: 10px 16px 4px;
    font-size: 13px;
  }
  .controls select {
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.25);
    background: #fff;
  }
  #fpsInfo { color: var(--dim); font-size: 12px; }
  .stage {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 16px;
  }
  #btn {
    width: min(38vw, 160px);
    height: min(38vw, 160px);
    border-radius: 50%;
    border: none;
    background: var(--black);
    box-shadow:
      0 8px 24px rgba(0,0,0,0.35),
      0 0 0 3px rgba(255,255,255,0.5);
    transition: background 150ms ease, box-shadow 150ms ease, transform 120ms ease;
    cursor: pointer;
  }
  #btn:active { transform: scale(0.97); }
  #btn.gray  { background: var(--gray); }
  #btn.red   { background: var(--red);   box-shadow: 0 0 40px 4px rgba(213,55,47,0.45); }
  #btn.green { background: var(--green); box-shadow: 0 0 40px 4px rgba(47,158,90,0.4); }
  #status {
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--dim);
    text-align: center;
    min-height: 18px;
    font-weight: 500;
  }
  #counters {
    flex: 0 0 auto;
    text-align: center;
    font-size: 12px;
    color: var(--dim);
    padding: 2px 12px 6px;
  }
  .logPanel {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 12px 10px;
  }
  .logActions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 4px 0 8px;
  }
  .logActions button {
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  .logActions button:active { opacity: 0.8; }
  #logList {
    flex: 1 1 auto;
    overflow-y: auto;
    background: rgba(0,0,0,0.08);
    border-radius: 10px;
    padding: 6px 8px;
    font: 12px/1.6 ui-monospace, monospace;
  }
  #logList .row { padding: 2px 2px; border-bottom: 1px solid rgba(0,0,0,0.08); }
  #logList .row:last-child { border-bottom: none; }
  #logList .empty { color: var(--dim); font-style: italic; }
  #preview {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
    transition: opacity 300ms ease;
    border: 1px solid rgba(255,255,255,0.15);
    pointer-events: none;
  }
  #preview.visible { opacity: 0.9; }
  #debug {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 40vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.88);
    color: #7CFC7C;
    font: 11px/1.4 ui-monospace, monospace;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
    z-index: 999;
  }
  #debug.visible { display: block; }
  #debug .err { color: #ff6b5e; }
</style>
</head>
<body>
  <div class="app">
    <div class="controls">
      <label for="fpsSelect">FPS richiesti alla fotocamera:</label>
      <select id="fpsSelect">
        <option value="">Auto (predefinito)</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="30" selected>30</option>
        <option value="48">48</option>
        <option value="50">50</option>
        <option value="60">60</option>
        <option value="90">90</option>
        <option value="120">120</option>
      </select>
      <span id="fpsInfo"></span>
    </div>
    <div class="stage">
      <button id="btn" aria-label="Stato occhio"></button>
      <div id="status">Tocca per iniziare</div>
    </div>
    <div id="counters">Battiti: 0 · Frame elaborati: 0 · FPS osservati: –</div>
    <div class="logPanel">
      <div class="logActions">
        <button id="exportBtn">Esporta CSV</button>
        <button id="clearBtn">Svuota</button>
      </div>
      <div id="logList"><div class="empty">Nessun battito registrato.</div></div>
    </div>
  </div>
  <video id="preview" autoplay muted playsinline></video>
  <div id="debug"></div>

<script>
  // Script "classico" (non modulo): gira SEMPRE, anche se il modulo sotto
  // fallisce a caricarsi. Mostra ogni errore direttamente in pagina.
  const debugPanel = document.getElementById("debug");
  const DEBUG = new URLSearchParams(location.search).has("debug");
  function logDebug(msg, isErr) {
    if (DEBUG || isErr) debugPanel.classList.add("visible");
    const line = document.createElement("div");
    if (isErr) line.className = "err";
    line.textContent = msg;
    debugPanel.appendChild(line);
    debugPanel.scrollTop = debugPanel.scrollHeight;
  }
  window.addEventListener("error", (e) => {
    logDebug("Errore: " + (e.message || e.error) + (e.filename ? " @ " + e.filename + ":" + e.lineno : ""), true);
  });
  window.addEventListener("unhandledrejection", (e) => {
    logDebug("Promise non gestita: " + (e.reason?.message || e.reason), true);
  });
  logDebug("Protocollo pagina: " + location.protocol + " — se è 'file:' i moduli ES potrebbero essere bloccati.");

  // PWA: service worker per l'uso offline dopo il primo avvio.
  // Richiede un contesto sicuro (https o localhost): su file:// la
  // registrazione fallisce silenziosamente, il resto della pagina funziona lo stesso.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
      .then((reg) => logDebug("Service worker registrato, scope: " + reg.scope))
      .catch((err) => logDebug("Service worker non registrato: " + err.message, true));
  }

  // Gli script modulo sono già eseguiti quando scatta "load": se il flag manca,
  // il modulo MediaPipe non si è caricato (tipicamente: primo avvio senza internet).
  window.addEventListener("load", () => {
    if (!window.__moduleLoaded) {
      document.getElementById("status").textContent =
        "Impossibile caricare MediaPipe: al primo avvio serve internet.";
      logDebug("Modulo MediaPipe non caricato.", true);
    }
  });
</script>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
window.__moduleLoaded = true;
logDebug("Modulo MediaPipe importato correttamente.");

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const previewEl = document.getElementById("preview");
const fpsSelect = document.getElementById("fpsSelect");
const fpsInfoEl = document.getElementById("fpsInfo");
const countersEl = document.getElementById("counters");
const logListEl = document.getElementById("logList");
const exportBtn = document.getElementById("exportBtn");
const clearBtn = document.getElementById("clearBtn");

// stato del cerchio: 'idle' | 'searching' | 'open' | 'closed'
let appState = "idle";
let running = false;

let videoEl = null;
let stream = null;
let landmarker = null;
let rafId = null;
let usingFrameCallback = false;

let audioCtx = null;

// Soglie di isteresi (le stesse delle altre varianti), ma qui SENZA alcun
// "hold" temporale sulla chiusura: lo scopo di questo test è proprio
// catturare anche i blink più rapidi, non filtrarli come fa l'allarme.
const CLOSE_THRESHOLD = 0.62;
const OPEN_THRESHOLD = 0.35;

let eyeClosed = false;
let closedFrameCount = 0;
let blinkStartMediaTime = null; // secondi, timeline del video (solo con requestVideoFrameCallback)
let blinkStartPerfTime = null;  // ms, performance.now() (fallback rAF)

let framesProcessed = 0;
let runStartTs = null;
let negotiatedFps = null;

let blinkCount = 0;
const blinkLog = []; // { n, time, frames, durationMs }

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
      logDebug("Schermo mantenuto acceso.");
    }
  } catch (e) {
    logDebug("Wake lock non disponibile: " + (e?.message || e));
  }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
// il sistema rilascia il wake lock quando la pagina va in secondo piano: lo riprende al ritorno
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running) requestWakeLock();
});

function setButtonVisual(state) {
  btn.classList.remove("gray", "red", "green");
  if (state === "searching") btn.classList.add("gray");
  else if (state === "open") btn.classList.add("green");
  else if (state === "closed") btn.classList.add("red");
}

function setStatusText(state) {
  const map = {
    idle: "Tocca per iniziare",
    searching: "Ricerca volto…",
    open: "Occhio aperto",
    closed: "Occhio chiuso",
  };
  statusEl.textContent = map[state] ?? "";
}

function setAppState(state) {
  appState = state;
  setButtonVisual(state);
  setStatusText(state);
}

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume().catch((e) => console.warn("Audio resume:", e));
  }
}

// Bip breve (non continuo) al riconoscimento di un battito completo.
function beep() {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = 1200;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t0 = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.25, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
  osc.start(t0);
  osc.stop(t0 + 0.1);
}

async function loadLandmarker() {
  if (landmarker) return landmarker;
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  landmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numFaces: 1,
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: false,
  });
  return landmarker;
}

// Avvia la fotocamera chiedendo l'fps scelto. Prova prima "exact": se il
// dispositivo non lo supporta affatto (OverconstrainedError) ritenta con
// "ideal", che il browser approssima al valore più vicino disponibile.
// In entrambi i casi l'fps REALMENTE negoziato va letto da
// track.getSettings(), perché i telefoni quantizzano su pochi valori fissi
// (tipicamente 30/60) e raramente espongono a getUserMedia le modalità
// slow-motion (90/120) riservate all'app Camera nativa.
async function startCamera(fps) {
  const base = { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } };
  let mode = fps ? "exact" : "auto";
  let constraints = fps
    ? { video: { ...base, frameRate: { exact: fps } }, audio: false }
    : { video: base, audio: false };

  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (err) {
    if (fps && err.name === "OverconstrainedError") {
      logDebug(`FPS ${fps} esatti non supportati dal dispositivo, ritento con "ideal"…`, true);
      mode = "ideal";
      constraints = { video: { ...base, frameRate: { ideal: fps } }, audio: false };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } else {
      throw err;
    }
  }

  videoEl = document.createElement("video");
  videoEl.srcObject = stream;
  videoEl.muted = true;
  videoEl.playsInline = true;
  await videoEl.play();

  previewEl.srcObject = stream;
  previewEl.classList.add("visible");

  const [track] = stream.getVideoTracks();
  const settings = track.getSettings ? track.getSettings() : {};
  negotiatedFps = typeof settings.frameRate === "number" ? Math.round(settings.frameRate * 10) / 10 : null;
  fpsInfoEl.textContent = `negoziati: ${negotiatedFps ?? "n/d"} fps (${mode}${fps ? ", richiesti " + fps : ""})`;
  logDebug(`Fotocamera avviata. Richiesti: ${fps ?? "auto"} fps (${mode}). Negoziati (track.getSettings): ${negotiatedFps ?? "n/d"} fps. Risoluzione: ${settings.width ?? "?"}x${settings.height ?? "?"}.`);
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  previewEl.classList.remove("visible");
  previewEl.srcObject = null;
  videoEl = null;
}

function blinkScore(result) {
  const cats = result.faceBlendshapes?.[0]?.categories;
  if (!cats) return null;
  let left = 0, right = 0;
  for (const c of cats) {
    if (c.categoryName === "eyeBlinkLeft") left = c.score;
    if (c.categoryName === "eyeBlinkRight") right = c.score;
  }
  return (left + right) / 2;
}

function formatClock(d) {
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");
  const ms = String(d.getMilliseconds()).padStart(3, "0");
  return `${hh}:${mm}:${ss}.${ms}`;
}

function recordBlink(frames, durationMs) {
  blinkCount++;
  const entry = { n: blinkCount, time: formatClock(new Date()), frames, durationMs: Math.round(durationMs) };
  blinkLog.push(entry);
  renderLogRow(entry);
  updateCounters();
}

function renderLogRow(entry) {
  if (logListEl.querySelector(".empty")) logListEl.innerHTML = "";
  const row = document.createElement("div");
  row.className = "row";
  row.textContent = `#${entry.n}  ${entry.time}  —  frame chiusura: ${entry.frames}  (~${entry.durationMs} ms)`;
  logListEl.appendChild(row);
  logListEl.scrollTop = logListEl.scrollHeight;
}

function updateCounters() {
  let observed = "–";
  if (runStartTs !== null) {
    const elapsedS = (performance.now() - runStartTs) / 1000;
    if (elapsedS > 1) observed = (framesProcessed / elapsedS).toFixed(1);
  }
  countersEl.textContent = `Battiti: ${blinkCount} · Frame elaborati: ${framesProcessed} · FPS osservati: ${observed}`;
}

function resetBlinkState() {
  eyeClosed = false;
  closedFrameCount = 0;
  blinkStartMediaTime = null;
  blinkStartPerfTime = null;
}

function evaluateFrame(result, now, mediaTimeSec) {
  const hasFace = result.faceLandmarks && result.faceLandmarks.length > 0;

  if (!hasFace) {
    if (eyeClosed) logDebug("Battito interrotto: volto perso durante la chiusura (scartato, non registrato).");
    resetBlinkState();
    if (appState !== "searching") setAppState("searching");
    return;
  }

  const score = blinkScore(result);

  if (score !== null && score > CLOSE_THRESHOLD) {
    if (!eyeClosed) {
      eyeClosed = true;
      closedFrameCount = 0;
      blinkStartMediaTime = mediaTimeSec;
      blinkStartPerfTime = now;
    }
    closedFrameCount++;
    if (appState !== "closed") setAppState("closed");
  } else if (score === null || score < OPEN_THRESHOLD) {
    if (eyeClosed) {
      const durationMs = mediaTimeSec !== null
        ? (mediaTimeSec - blinkStartMediaTime) * 1000
        : (now - blinkStartPerfTime);
      recordBlink(closedFrameCount, durationMs);
      beep();
    }
    resetBlinkState();
    if (appState !== "open") setAppState("open");
  }
  // zona intermedia: nessun cambio di stato, evita sfarfallio
}

// Percorso principale: un frame REALE della fotocamera per callback,
// indipendente dal refresh dello schermo. È quello che rende il conteggio
// dei frame confrontabile tra fps diversi.
function onVideoFrame(now, metadata) {
  if (!running || !videoEl) return;
  framesProcessed++;
  const result = landmarker.detectForVideo(videoEl, performance.now());
  evaluateFrame(result, now, metadata.mediaTime);
  updateCounters();
  videoEl.requestVideoFrameCallback(onVideoFrame);
}

// Fallback se il browser non supporta requestVideoFrameCallback: il
// conteggio dei frame segue il refresh dello schermo, non la fotocamera,
// quindi è solo approssimativo (lo si segnala in log).
function onAnimationFrame() {
  if (!running || !videoEl) return;
  const now = performance.now();
  framesProcessed++;
  const result = landmarker.detectForVideo(videoEl, now);
  evaluateFrame(result, now, null);
  updateCounters();
  rafId = requestAnimationFrame(onAnimationFrame);
}

async function start() {
  running = true;
  setAppState("searching");
  fpsSelect.disabled = true;
  framesProcessed = 0;
  runStartTs = performance.now();
  resetBlinkState();
  logDebug("Tocco registrato, avvio in corso…");
  ensureAudio();
  requestWakeLock();
  try {
    const fps = fpsSelect.value ? parseInt(fpsSelect.value, 10) : null;
    logDebug("Richiedo accesso alla fotocamera…");
    await startCamera(fps);
    logDebug("Carico il modello MediaPipe…");
    await loadLandmarker();
    logDebug("Modello caricato. Inizio rilevamento.");
    if (!running) return; // messo in pausa durante il caricamento

    if (typeof videoEl.requestVideoFrameCallback === "function") {
      usingFrameCallback = true;
      videoEl.requestVideoFrameCallback(onVideoFrame);
    } else {
      usingFrameCallback = false;
      logDebug("requestVideoFrameCallback non supportato da questo browser: conteggio frame approssimato sul refresh schermo.", true);
      rafId = requestAnimationFrame(onAnimationFrame);
    }
  } catch (err) {
    console.error(err);
    logDebug("Errore in start(): " + (err?.message || err), true);
    statusEl.textContent = "Accesso alla fotocamera negato o non disponibile";
    running = false;
    releaseWakeLock();
    fpsSelect.disabled = false;
    setAppState("idle");
  }
}

function pause() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  resetBlinkState();
  stopCamera();
  releaseWakeLock();
  fpsSelect.disabled = false;
  setAppState("idle");
}

btn.addEventListener("click", () => {
  if (!running) start();
  else pause();
});

clearBtn.addEventListener("click", () => {
  blinkLog.length = 0;
  blinkCount = 0;
  logListEl.innerHTML = '<div class="empty">Nessun battito registrato.</div>';
  updateCounters();
});

exportBtn.addEventListener("click", () => {
  const header = "n;ora;frame_chiusura;durata_ms;fps_richiesti;fps_negoziati\n";
  const fpsReq = fpsSelect.value || "auto";
  const rows = blinkLog
    .map((e) => `${e.n};${e.time};${e.frames};${e.durationMs};${fpsReq};${negotiatedFps ?? ""}`)
    .join("\n");
  const csv = header + rows + (rows ? "\n" : "");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  a.href = url;
  a.download = `blink-test-${fpsReq}fps-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

setAppState("idle");
updateCounters();
</script>
</body>
</html>
